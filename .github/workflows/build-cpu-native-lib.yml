name: 'CPUのビルド(Native)'

on:
  workflow_dispatch:
  push:
    paths:
      - 'buffer/cpu/rs/**'
      - '.github/workflows/build-cpu-native-lib.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            os_name: macos
            arch: Arm64
            lib_extension: a
          - os: macos-15
            os_name: macos
            arch: X64
            lib_extension: a
          # Linux
          - os: ubuntu-latest
            os_name: linux
            arch: X64
            lib_extension: a
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: Arm64
            lib_extension: a
          # Windows
          - os: windows-latest
            os_name: mingw
            arch: X64
            lib_extension: lib

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os_name }}/${{ matrix.arch }})

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Fortranのセットアップ (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: gradlewに権限を付与 (Unix)
        if: runner.os != 'Windows'
        run: chmod 777 ./gradlew

      - name: キャッシュを復元
        uses: actions/cache@v4
        with:
          path: buffer/cpu/cpp/build/rs/target
          key: cpu-${{ hashFiles('buffer/cpu/rs/Cargo.toml') }}-${{ matrix.os_name }}-${{ matrix.arch }}

      - name: ネイティブライブラリをビルド(Windows以外)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew buffer:cpu:cpp:cargoNativeBuild

      - name: vcvarsall.batへのパスを取得
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath = vswhere -latest -property installationPath
          $vcvarsPath = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"

          echo "VCVARSALL_PATH=$vcvarsPath" >> $env:GITHUB_ENV

      - name: ネイティブライブラリをビルド(Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" x64
          call gradlew.bat buffer:cpu:cpp:cargoNativeBuild

      - name: 成果物をアップロード (Windows以外)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            buffer/cpu/rs/target/release/libcpu.${{ matrix.lib_extension }}
          if-no-files-found: error

      - name: 成果物をアップロード (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            buffer/cpu/rs/target/release/cpu.${{ matrix.lib_extension }}
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-latest
    name: Commit native libraries

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: 全成果物をダウンロード
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: アーティファクト構造を確認
        run: |
          echo "=== Artifacts structure ==="
          find artifacts -type f

      - name: 成果物をresourcesに配置
        run: |
          # macOS/Arm64
          mkdir -p buffer/cpu/src/nativeMain/resources/cpu/macosArm64
          find artifacts/cpu-macos-Arm64 -name "libcpu.a" -exec cp {} buffer/cpu/src/nativeMain/resources/cpu/macosArm64/ \;

          # macOS/X64
          mkdir -p buffer/cpu/src/nativeMain/resources/cpu/macosX64
          find artifacts/cpu-macos-X64 -name "libcpu.a" -exec cp {} buffer/cpu/src/nativeMain/resources/cpu/macosX64/ \;

          # Linux/X64
          mkdir -p buffer/cpu/src/nativeMain/resources/cpu/linuxX64
          find artifacts/cpu-linux-X64 -name "libcpu.a" -exec cp {} buffer/cpu/src/nativeMain/resources/cpu/linuxX64/ \;

          # Linux/Arm64
          mkdir -p buffer/cpu/src/nativeMain/resources/cpu/linuxArm64
          find artifacts/cpu-linux-Arm64 -name "libcpu.a" -exec cp {} buffer/cpu/src/nativeMain/resources/cpu/linuxArm64/ \;

          # Windows/X64
          mkdir -p buffer/cpu/src/nativeMain/resources/cpu/mingwX64
          find artifacts/cpu-mingw-X64 -name "cpu.lib" -exec cp {} buffer/cpu/src/nativeMain/resources/cpu/mingwX64/ \;

          echo "=== Resources structure ==="
          find buffer/cpu/src/nativeMain/resources -type f

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add buffer/cpu/src/nativeMain/resources/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[CI] Update CPU(Native) libraries"
            git push
          fi
