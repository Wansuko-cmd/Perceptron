name: 'TinyStoriesモデルの出力を確認(GPU)'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '実行環境'
        required: true
        default: 'macos-latest'
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        index: [ 0, 1, 2, 3, 4 ]
    runs-on: ${{ (github.event_name == 'workflow_dispatch') && github.event.inputs.environment || 'ubuntu-latest' }}
    name: Build on ${{ (github.event_name == 'workflow_dispatch') && github.event.inputs.environment || 'ubuntu-latest' }}/${{ matrix.index }}
    steps:
      - name: リポジトリにチェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: TinyStoriesデータセットのキャッシュを復元
        id: cache-tiny-stories
        uses: actions/cache@v4
        with:
          path: sample/src/commonMain/resources/stories
          key: tiny-stories-dataset-v1

      - name: TinyStoriesデータセットをダウンロード
        if: steps.cache-tiny-stories.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p sample/src/commonMain/resources/stories
          echo "TinyStories-train.txtをダウンロード中..."
          curl -L -o "sample/src/commonMain/resources/stories/TinyStories-train.txt" "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStories-train.txt"
          echo "TinyStories-valid.txtをダウンロード中..."
          curl -L -o "sample/src/commonMain/resources/stories/TinyStories-valid.txt" "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStories-valid.txt"
          echo "ダウンロード完了"

      - name: gradlewに権限を付与 (Unix)
        if: runner.os != 'Windows'
        run: chmod 777 ${{ github.workspace }}/gradlew

      - name: TinyStoriesテストを実行
        shell: bash
        run: |
          ./gradlew sample:jvmTest --tests "stories.TinyStoriesGPUTest" --info
