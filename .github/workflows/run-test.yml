name: 'テストを実行'

on:
  workflow_dispatch:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 仮想ブランチにチェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: gradlewに権限を付与 (Unix)
        if: runner.os != 'Windows'
        run: chmod 777 ${{ github.workspace }}/gradlew

      - name: OpenBLASをインストール(Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libopenblas-dev
          echo "OPENBLAS_HOME=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: テストを実行
        run: |
          ./gradlew buffer:allTest
          ./gradlew io-type:allTest
          ./gradlew network:allTest
