name: 'テストを実行'

on:
  workflow_dispatch:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 仮想ブランチにチェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: MSYS2のセットアップ
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: gradlewに権限を付与 (Unix)
        if: runner.os != 'Windows'
        run: chmod 777 ${{ github.workspace }}/gradlew

      - name: OpenBLASをインストール(Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libopenblas-dev
          echo "OPENBLAS_HOME=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: OpenBLASをインストール(Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p openblas
          curl -L -o "openblas.zip" "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.31/OpenBLAS-0.3.31-x64.zip"
          tar -xf openblas.zip -C openblas
          echo "OPENBLAS_HOME=$((Get-Item .).FullName)\openblas\win64\lib" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: ビルド
        run: |
          ./gradlew sample:mingX64Binaries --info

      - name: テストを実行
        run: |
          ./gradlew buffer:mingX64Test --info
          ./gradlew io-type:mingX64Test --info
          ./gradlew network:mingX64Test --info

      - name: 直接実行
        if: failure()
        shell: cmd
        run: |
          D:\a\knist\knist\buffer\build\bin\mingwX64\debugTest\test.exe
