name: 'MNISTモデルの精度を確認'

on:
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 仮想ブランチにチェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: MNISTデータセットのキャッシュを復元
        id: cache-mnist
        uses: actions/cache@v4
        with:
          path: sample/src/commonMain/resources/mnist
          key: mnist-dataset-v1

      - name: MNISTデータセットをダウンロード
        if: steps.cache-mnist.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p sample/src/commonMain/resources/mnist
          echo "train-images-idx3-ubyte.gzをダウンロード中..."
          curl -L -o "sample/src/commonMain/resources/mnist/train-images-idx3-ubyte.gz" "https://ossci-datasets.s3.amazonaws.com/mnist/train-images-idx3-ubyte.gz"
          echo "train-labels-idx1-ubyte.gzをダウンロード中..."
          curl -L -o "sample/src/commonMain/resources/mnist/train-labels-idx1-ubyte.gz" "https://ossci-datasets.s3.amazonaws.com/mnist/train-labels-idx1-ubyte.gz"
          echo "t10k-images-idx3-ubyte.gzをダウンロード中..."
          curl -L -o "sample/src/commonMain/resources/mnist/t10k-images-idx3-ubyte.gz" "https://ossci-datasets.s3.amazonaws.com/mnist/t10k-images-idx3-ubyte.gz"
          echo "t10k-labels-idx1-ubyte.gzをダウンロード中..."
          curl -L -o "sample/src/commonMain/resources/mnist/t10k-labels-idx1-ubyte.gz" "https://ossci-datasets.s3.amazonaws.com/mnist/t10k-labels-idx1-ubyte.gz"
          echo "ダウンロード完了"

      - name: ./gradlewに権限を付与
        run: |
          chmod 777 ${{ github.workspace }}/gradlew

      - name: MNISTテストを実行(Native)
        run: |
          sudo apt update
          sudo apt install libopenblas-dev
          ${{ github.workspace }}/gradlew sample:linuxX64Test --tests "mnist.MnistTest" --info

      - name: MNISTテストを実行(JVM)
        run: |
          ${{ github.workspace }}/gradlew sample:jvmTest --tests "mnist.MnistTest" --info
