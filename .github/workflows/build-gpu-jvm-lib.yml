name: 'GPUのビルド(JVM)'

on:
  workflow_dispatch:
  push:
    paths:
      - 'buffer/gpu/rs/**'
      - '.github/workflows/build-gpu-jvm-lib.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            os_name: macos
            arch: Arm64
            lib_extension: dylib
          - os: macos-15
            os_name: macos
            arch: X64
            lib_extension: dylib
          # Linux
          - os: ubuntu-latest
            os_name: linux
            arch: X64
            lib_extension: so
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: Arm64
            lib_extension: so
          # Windows
          - os: windows-latest
            os_name: mingw
            arch: X64
            lib_extension: dll

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os_name }}/${{ matrix.arch }})

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: gradlewに権限を付与 (Unix)
        if: runner.os != 'Windows'
        run: chmod 777 ./gradlew

      - name: キャッシュを復元
        uses: actions/cache@v4
        with:
          path: buffer/gpu/cpp/rs/target
          key: gpu-${{ hashFiles('buffer/gpu/rs/Cargo.toml') }}-${{ matrix.os_name }}-${{ matrix.arch }}

      - name: ネイティブライブラリをビルド(Windows以外)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew buffer:gpu:rs:cargoJvmBuild

      - name: vcvarsall.batへのパスを取得
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath = vswhere -latest -property installationPath
          $vcvarsPath = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"

          echo "VCVARSALL_PATH=$vcvarsPath" >> $env:GITHUB_ENV

      - name: ネイティブライブラリをビルド(Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" x64
          call gradlew.bat buffer:gpu:rs:cargoJvmBuild

      - name: 成果物をアップロード (Windows以外)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            buffer/gpu/rs/target/release/libgpu.${{ matrix.lib_extension }}
          if-no-files-found: error

      - name: 成果物をアップロード (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            buffer/gpu/rs/target/release/gpu.${{ matrix.lib_extension }}
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-latest
    name: Commit native libraries

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: 全成果物をダウンロード
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: アーティファクト構造を確認
        run: |
          echo "=== Artifacts structure ==="
          find artifacts -type f

      - name: 成果物をresourcesに配置
        run: |
          # macOS/Arm64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/macos/Arm64
          find artifacts/gpu-macos-Arm64 -name "libgpu.dylib" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/macos/Arm64/ \;

          # macOS/X64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/macos/X64
          find artifacts/gpu-macos-X64 -name "libgpu.dylib" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/macos/X64/ \;

          # Linux/X64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/linux/X64
          find artifacts/gpu-linux-X64 -name "libgpu.so" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/linux/X64/ \;

          # Linux/Arm64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/linux/Arm64
          find artifacts/gpu-linux-Arm64 -name "libgpu.so" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/linux/Arm64/ \;

          # Windows/X64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/mingw/X64
          find artifacts/gpu-mingw-X64 -name "gpu.dll" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/mingw/X64/ \;

          echo "=== Resources structure ==="
          find buffer/gpu/src/jvmMain/resources -type f

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add buffer/gpu/src/jvmMain/resources/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[CI] Update GPU(JVM) libraries"
            git push
          fi
